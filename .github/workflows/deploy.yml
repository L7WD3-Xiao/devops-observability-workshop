name: Deploy

# 开启手动触发
on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # 只有在 main 分支上的 push 才执行（避免从 develop 分支部署生产）
    if: github.ref == 'refs/heads/main'
    # 使用 GitHub 的 Environment 功能，可以配置部署审批（需要手动确认）
    environment:
      name: production
      url: https://your-prod-domain.com   # 你的生产域名
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

name: Shortener CI/CD (Local Build)

on:
  push:
    branches: [ develop ]
  # pull_request:
  #   branches: [ master ]

# 全局环境变量，后续步骤可以直接使用 ${{ env.XXX }}
# 实际并不使用，而是使用的是配置在secrets中的变量
# env:
#   DEV_HOST: your-dev-server.com
#   SSH_USER: your-ssh-username

jobs:
  # 1. 代码检查 + 单元测试（可选）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # working-directory: ./app
        run: pip install -r requirements.txt
      - name: Run unit tests (if any)
        run: |
          # 这里可以加 pytest，暂时留空
          echo "No unit tests yet"

  # 2. 部署到开发环境（直接在目标主机上构建镜像）
  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code again (for transfer to host)
        uses: actions/checkout@v4

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 将整个项目代码同步到目标主机的 /opt/shortener 目录
          script: |
            # 1. 如果目标目录不存在则克隆，否则更新代码（可以用 rsync 或 git pull）
            if [ ! -d "/opt/shortener" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }} /opt/shortener
            else
              cd /opt/shortener
              git fetch origin
              git reset --hard ${{ github.sha }}
            fi
            
            # 2. 进入项目目录，构建镜像
            cd /opt/shortener
            make build
            
            # 3. 用 docker-compose 重启服务，仅重启 app 不重启依赖
            docker compose up -d --no-deps app

      - name: Smoke test
        run: |
          sleep 10
          SHORT_CODE=$(curl -s -X POST "http://${{ secrets.DEV_HOST }}:8000/shorten?original_url=https://www.baidu.com" | jq -r '.short_code')
          curl -f -L "http://${{ secrets.DEV_HOST }}:8000/$SHORT_CODE" || exit 1

  # 3. 性能测试 + SLO 校验（与之前相同，依赖测试主机上的 Prometheus）
  performance-slo-check:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run load test
        run: |
          SHORT_CODE=$(curl -s -X POST "http://47.114.124.150:8000/shorten?original_url=https://www.baidu.com" | jq -r '.short_code')
          echo '
          import http from "k6/http";
          import { check } from "k6";
          export let options = {
            vus: 30,
            duration: "30s",
          };
          export default function () {
            let res = http.get(__ENV.URL);
            check(res, { "status is 3xx": (r) => r.status >= 300 && r.status < 400 });
          }' | k6 run -e URL="http://47.114.124.150:8000/$SHORT_CODE" -
      - name: Check SLO error budget
        run: |
          # 查询主机上的 Prometheus （需要主机 Prometheus 端口可被 GitHub Actions 访问）
          RESULT=$(curl -s "http://${{ secrets.PROMETHEUS_DEV }}/api/v1/query?query=shortener:error_budget_burn_rate" | jq -r '.data.result[0].value[1]')
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "错误预算燃烧率获取失败: $RESULT"
            exit 1
          fi
          
          # 使用 awk 进行数值比较，更安全
          if awk "BEGIN {exit(!($RESULT > 10))}"; then
            echo "错误预算燃烧率过高: $RESULT，流水线失败，阻止部署到生产"
            exit 1
          else
            echo "SLO 正常，错误预算燃烧率: $RESULT"
          fi
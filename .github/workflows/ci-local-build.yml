name: Shortener CI/CD (Local Build)

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

# 全局环境变量，后续步骤可以直接使用 ${{ env.XXX }}
# 实际并不使用，而是使用的是配置在secrets中的变量
# env:
#   DEV_HOST: your-dev-server.com
#   SSH_USER: your-ssh-username

jobs:
  # 1. 代码检查 + 单元测试（可选）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # working-directory: ./app
        run: pip install -r requirements.txt
      - name: Run unit tests (if any)
        run: |
          # 这里可以加 pytest，暂时留空
          echo "No unit tests yet"

  # 2. 部署到开发环境（直接在目标主机上构建镜像）
  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code again (for transfer to host)
        uses: actions/checkout@v4

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 将整个项目代码同步到目标主机的 /opt/shortener 目录
          script: |
            # 1. 如果目标目录不存在则克隆，否则更新代码（可以用 rsync 或 git pull）
            if [ ! -d "/opt/shortener" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }} /opt/shortener
            else
              cd /opt/shortener
              git fetch origin
              git reset --hard ${{ github.sha }}
            fi
            
            # 2. 进入项目目录，构建镜像
            cd /opt/shortener
            make build
            
            # 3. 用 docker-compose 重启服务（如果依赖 db/redis 等）
            # 这里假设你已经在主机上准备好了 docker-compose.yml ，里面引用 shortener:latest
            docker compose up -d --no-deps app

      - name: Smoke test
        run: |
          sleep 10
          SHORT_CODE=$(curl -s -X POST "http://${{ secrets.DEV_HOST }}/shorten?original_url=https://www.google.com" | jq -r '.short_code')
          curl -f -L "http://${{ secrets.DEV_HOST }}/$SHORT_CODE" || exit 1

  # 3. 性能测试 + SLO 校验（与之前相同，依赖测试主机上的 Prometheus）
  performance-slo-check:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6   # 更简单的方式，部分 runner 已预装
      - name: Run load test
        run: |
          SHORT_CODE=$(curl -s -X POST "http://${{ secrets.DEV_HOST }}/shorten?original_url=https://www.baidu.com" | jq -r '.short_code')
          k6 run -e URL="http://${{ secrets.DEV_HOST }}/$SHORT_CODE" - <(cat <<EOF
          import http from 'k6/http';
          import { check } from 'k6';
          export let options = {
            vus: 30,
            duration: '30s',
          };
          export default function () {
            let res = http.get(__ENV.URL);
            check(res, { 'status is 3xx': (r) => r.status >= 300 && r.status < 400 });
          }
          EOF
          )
      - name: Check SLO error budget
        run: |
          # 查询主机上的 Prometheus （需要主机 Prometheus 端口可被 GitHub Actions 访问）
          # 这里简化：执行主机上的脚本 check_slo.sh
          ssh ${{ secrets.SSH_USER }}@${{ secrets.DEV_HOST }} '/opt/scripts/check_slo.sh' || exit 1

  # 4. 生产环境部署（仅逻辑描述，不实际执行，以下配置仅供参考）
  deploy-prod:
    needs: performance-slo-check
    runs-on: ubuntu-latest
    if: false   # 禁止自动执行，仅用于展示逻辑
    # 只有在 main 分支上的 push 才执行（避免从 develop 分支部署生产）
    # if: github.ref == 'refs/heads/main'
    # 使用 GitHub 的 Environment 功能，可以配置部署审批（需要手动确认）
    environment:
      name: production
      url: https://your-prod-domain.com   # 你的生产域名
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/shortener
            docker compose pull app
            docker compose up -d --no-deps app
            docker image prune -f
groups:
  - name: slo
    interval: 30s
    rules:
      #=============SLO目标================
      - record: slo:target
        expr: 0.9
        labels:
          service: "my-service"
          tier: "production"

      #=============指标计算================
      # 跳转请求总数（基于自定义计数器 shortener_redirect_requests_total）
      # 该计数器只在通过长度校验（SHORT_CODE_LENGTH）后埋点，
      # 扫描器打在 /{short_code} 上的乱路径 404 不计入，避免拉低 SLO
      - record: shortener:redirect_total
        expr: |
          sum(
            increase(shortener_redirect_requests_total[1h])
          )

      # 成功的请求总数（2xx/3xx，跳转真实状态码为 3xx）
      - record: shortener:redirect_success_total
        expr: |
          sum(
            increase(shortener_redirect_requests_total{status_code=~"2xx|3xx"}[1h])
          )

      # 当前 SLI（实际成功率）
      - record: shortener:sli_current
        expr: shortener:redirect_success_total / shortener:redirect_total

      - record: shortener:sli_month
        expr: sum(rate(shortener:redirect_success_total[30d])) / sum(rate(shortener:redirect_total[30d]))

      # 错误预算燃烧率 / 错误预算剩余百分比
      # 错误预算燃烧率: 实际错误率 / (1 - SLO目标)
      # 错误预算剩余百分比: 1 - 错误预算燃烧率
      - record: shortener:error_budget_burn_rate
        expr: |
          (1 - shortener:sli_current)
          /
          (1 - max(slo:target))
      
      - record: shortener:error_budget_remaining
        expr: |
          1 - (
            (1 - shortener:sli_month)
            /
            (1 - max(slo:target))
          )
      
      

      # 延迟相关（P99）
      - record: shortener:redirect_p99_latency_seconds
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{method="GET", handler="/{short_code}"}[5m])) by (le))

      - record: shortener:redirect_p90_latency_seconds
        expr: histogram_quantile(0.90, sum(rate(http_request_duration_seconds_bucket{method="GET", handler="/{short_code}"}[5m])) by (le))
      
      #=============告警规则================
      # 错误预算快速燃烧告警
      - alert: ErrorBudgetBurnRateHigh
        expr: shortener:error_budget_burn_rate > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "错误预算消耗过快"
          description: "过去1h错误预算消耗过快 当前剩余预算: {{ $value | humanizePercentage }}"

      # 剩余预算过低告警（低于30%）
      - alert: ErrorBudgetLow
        expr: shortener:error_budget_remaining < 0.3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "错误预算不足30%"
          description: "当前剩余错误预算: {{ $value | humanizePercentage }}，建议暂停发布或进行降级"
      
      # 延迟超标（P99 > 200ms）
      - alert: HighLatencySLO
        expr: shortener:redirect_p99_latency_seconds > 0.2
        for: 2m
        annotations:
          summary: "P99 延迟超过 200ms 当前值 {{ $value }}s"